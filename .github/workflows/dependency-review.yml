name: Dependencies

on:
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # weekly, Mondays 9am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Blocks a pull request only when it adds a dependency with a known
  # high or critical vulnerability. Existing advisories don't block.
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  # Weekly audit of runtime dependencies. The @wordpress/* packages are
  # externals supplied by WordPress core, so only critical issues fail.
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit
